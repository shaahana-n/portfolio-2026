        function scheduleOverrides() {

        function startObserver() {
          if (!window.MutationObserver || observer) return;
          observer = new MutationObserver(function (mutations) {
            for (var i = 0; i < mutations.length; i++) {

                return;

          observer.observe(main, { childList: true, subtree: true });
        }

        window.addEventListener('load', function () {

          startMetaPolaroidWatch();
          window.addEventListener('scroll', scheduleOverrides, { passive: true });
          [0, 500, 1500, 3000, 5000, 8000, 12000, 20000].forEach(function (delay) {
            window.setTimeout(applyOverrides, delay);
          });
