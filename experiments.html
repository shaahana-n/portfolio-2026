<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Experiments — Shaahana Naufal</title>
  <meta name="description" content="Design experiments by Shaahana Naufal.">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/cursor.css">
  <link rel="stylesheet" href="assets/sparkle-click.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<style>
@font-face {
      font-family: 'PP Editorial Old Ultralight Italic';
      src: url('assets/fonts/490f0e_bc9XGXnb6GMyRa5LT5y4giQlQxQ.woff2') format('woff2');
      font-weight: 400;
      font-style: italic;
      font-display: swap;
    }

    :root {
      --bg: #ffffff;
      --text: #1a1a1a;
      --text-muted: #666;
      --accent: #3f89fe;
      --page-max-width: 1400px;
    }
    * { box-sizing: border-box; }
    html { background-color: var(--bg); }
    body {
      margin: 0;
      font-family: 'Inter', -apple-system, sans-serif;
      font-size: 14px;
      color: var(--text);
      background-color: var(--bg);
      -webkit-font-smoothing: antialiased;
      line-height: 1.5;
    }
    a { color: inherit; text-decoration: none; }
    a:hover { color: var(--accent); }

    .page {
      max-width: var(--page-max-width);
      margin: 0 auto;
      padding: 64px 10vw 48px;
    }
    .hero-with-nav {
      width: 100%;
      max-width: 100%;
      display: flex;
      flex-direction: column;
      gap: 100px;
    }
    .site-top-links {
      display: flex;
      justify-content: center;
      width: 100%;
    }
    .site-nav-pill {
      display: inline-flex;
      align-items: center;
      gap: 28px;
      padding: 16px 32px;
      background: #ffffff;
      border: 1px solid #ececec;
      border-radius: 999px;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
    }
    .site-top-links .site-nav-link {
      font-family: 'Helvetica Neue', Helvetica, -apple-system, BlinkMacSystemFont, Arial, sans-serif;
      font-style: normal;
      font-weight: 400;
      font-size: 15px;
      line-height: 1;
      color: var(--text);
      text-decoration: none;
      transition: opacity 0.2s ease;
    }
    .site-top-links .site-nav-link:hover {
      color: var(--text);
      opacity: 0.55;
    }
    .site-top-links .site-nav-link[aria-current="page"] {
      color: var(--text);
      opacity: 1;
      font-weight: 500;
    }
    .experiments-intro {
      font-family: 'Helvetica Neue', Helvetica, -apple-system, BlinkMacSystemFont, Arial, sans-serif;
      font-weight: 500;
      font-size: 24px;
      line-height: 1.25;
      color: #000;
      margin: 0;
      text-wrap: pretty;
    }
    .contact-text-link {
      font-family: 'Helvetica Neue', Helvetica, -apple-system, BlinkMacSystemFont, Arial, sans-serif;
      font-weight: 500;
      font-size: 18px;
      line-height: 1.3;
      color: var(--text-muted);
      transition: color 0.2s ease;
    }
    .contact-text-link:hover {
      color: var(--text);
    }
    .footer {
      margin-top: 88px;
      padding-top: 56px;
      border-top: 1px solid rgba(0, 0, 0, 0.1);
    }
    .footer h2 {
      font-family: 'Helvetica Neue', Helvetica, -apple-system, BlinkMacSystemFont, Arial, sans-serif;
      font-size: 2rem;
      font-weight: 400;
      margin: 0 0 12px 0;
    }
    .footer-links {
      display: flex;
      flex-wrap: wrap;
      gap: 10px 20px;
      margin-top: 16px;
    }
    @media (max-width: 680px) {
      .site-nav-pill {
        gap: 20px;
        padding: 14px 22px;
      }
      .site-top-links .site-nav-link {
        font-size: 14px;
      }
      .experiments-intro {
        font-size: 26px;
        line-height: 1.35;
      }
    }
  </style>
<link rel="stylesheet" href="assets/site-nav.css">
<link rel="stylesheet" href="assets/site-display.css">
</head>
<body>
  <div class="page">
    <main>
      <div class="hero-with-nav">
        <header class="site-header"><nav class="site-top-links" aria-label="Site sections">
          <div class="site-nav-pill">
            <a href="index.html" class="site-nav-link">Work</a>
            <a href="about.html" class="site-nav-link">About</a>
          </div>
        </nav>
      </header><section class="experiments">
          <p class="experiments-intro">Side projects, prototypes, and things in progress.</p>
        </section>
      </div>

      <footer class="footer">
        <h2>Thanks for coming by!</h2>
        <nav class="footer-links" aria-label="Contact and social links">
          <a href="https://www.linkedin.com/in/shaahana-naufal/" target="_blank" rel="noopener" class="contact-text-link">LinkedIn</a>
          <a href="#" class="contact-text-link">Twitter</a>
          <a href="#" class="contact-text-link copy-email" data-email="shaahananaufal@gmail.com">Email</a>
        </nav>
      </footer>
    </main>
  </div>
  <script>
    document.querySelectorAll('.copy-email').forEach(function(link) {
      link.addEventListener('click', function(e) {
        e.preventDefault();
        var email = this.getAttribute('data-email');
        navigator.clipboard.writeText(email).then(function() {
          var original = link.textContent;
          link.textContent = 'Copied!';
          setTimeout(function() { link.textContent = original; }, 1500);
        });
      });
    });
  </script>
  <script src="assets/sparkle-click.js" defer></script>
</body>
</html>
